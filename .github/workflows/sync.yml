name: 기관 자료 동기화
on:
  workflow_dispatch:
    inputs:
      days:
        description: '수집 기간(최근 일수, 게시판 첫 페이지 기준)'
        default: '30'
        required: true
        type: choice
        options: ['7', '30', '90', '365']
  push:
    branches: [main]
    paths: ['scripts/**', 'sources.json', '.github/workflows/sync.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: official-briefing-sync
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate collector
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Collect official bulletin metadata
        env:
          LOOKBACK_DAYS: ${{ inputs.days || '30' }}
        run: python3 scripts/collect.py
      - name: Preserve collection result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if ! git diff --cached --quiet; then
            git commit -m "Update official bulletin candidates"
            git push origin HEAD:main
          fi
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html style.css app.js data.js README.md .nojekyll _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
